<!doctype html>
<!-- veripublica family-web — skeleton.html — template v4
     https://github.com/veripublica/family-web

     The shared shape of a family WASM demo page. Copy this next to your
     pkg/ output together with tokens.css and demo.css, then fill every
     TOOL: comment. Tool-specific result markup goes inside #result;
     tool-specific styles go in the inline <style> block, which starts empty
     on purpose — if something you write there would make sense for a
     sibling too, it belongs in demo.css via a family-web change instead. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TOOL: title, e.g. "epubveri — EPUB validation in your browser".
         Say what the tool does for the reader. No "WASM", no "demo": the person
         who lands here has an EPUB to check, not a runtime to shop for, and this
         string is what shows in a search result and a browser tab. (#9) -->
    <title>TOOLNAME — WHAT IT DOES in your browser</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./demo.css" />
    <script>
      // Theme, part 1 of 2 (part 2 is the toggle button in the footer).
      //
      // This MUST stay here: in <head>, inline, and not deferred. It runs before
      // the first paint, so a reader who chose dark never sees a white flash on
      // the way to it. Move it to the module script at the bottom and the flash
      // comes back — which is the whole bug this guards against.
      //
      // Guarded on light-dark(): without it, data-theme moves the scrollbars and
      // nothing else (see the floor in tokens.css), so we don't set it at all.
      // try/catch because localStorage throws when storage is blocked.
      try {
        if (CSS.supports("color", "light-dark(#000,#fff)")) {
          const t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        }
      } catch {}
    </script>
    <style>
      /* TOOL: page-local styles only (e.g. epubsana's .fix cards, badge
         tiers; epubveri's .id column). Keep this block small. */
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <!-- TOOL: name, and nothing else. "· WASM demo" used to live here; it was
             engineer language on a user-facing page, and "demo" undersold it —
             this page is not a preview of the tool, it is the tool, running. The
             line below says what actually matters, and the footer carries the
             build provenance for whoever wants it. If you want a quiet qualifier
             here (a version, a scope), .demo-tag is the class for it. (#9) -->
        <h1>TOOLNAME</h1>

        <!-- Theme, part 2 of 2. Every demo ships it, top-right, in this position
             (#7): a standard control placed differently on every page is only half
             standard, and this is where readers look. It hides itself where
             light-dark() is unsupported (demo.css), so it is never a dead control.
             The script sits immediately after the button on purpose — it labels it
             before the first paint, so the button is never briefly blank. -->
        <button class="theme-toggle" id="theme" type="button"></button>
        <script>
          (() => {
            const root = document.documentElement;
            const btn = document.getElementById("theme");
            const cycle = ["auto", "dark", "light"];
            const label = { auto: "◐ auto", dark: "☾ dark", light: "☀ light" };
            const save = (v) => {
              try {
                v ? localStorage.setItem("theme", v) : localStorage.removeItem("theme");
              } catch {}
            };
            const current = () => root.dataset.theme || "auto";
            const paint = () => {
              btn.textContent = label[current()];
              btn.title = "Theme: " + current() + " — click to change";
            };
            btn.addEventListener("click", () => {
              const next = cycle[(cycle.indexOf(current()) + 1) % cycle.length];
              if (next === "auto") delete root.dataset.theme;
              else root.dataset.theme = next;
              save(next === "auto" ? null : next);
              paint();
            });
            paint();
          })();
        </script>
      </div>
      <!-- TOOL: one honest sentence; keep the no-upload promise. This is the line
           that earns the reader's trust — do not trade it for a slogan. -->
      <p class="sub">A pure-Rust TOOL running entirely in your browser — no upload, no server. Your file never leaves this page.</p>

      <label class="drop" id="drop">
        <input type="file" id="file" accept=".epub,application/epub+zip" />
        Drop an <strong>.epub</strong> here, or click to choose one.
      </label>

      <!-- TOOL: loading message, e.g. "Loading validator…" -->
      <p class="status" id="status">Loading…</p>

      <section id="result" hidden>
        <!-- TOOL: result markup (verdict + table, fix cards + actionbar, …) -->
      </section>

      <footer>
        <!-- TOOL: crate name -->
        Served locally over HTTP. Built with <code>wasm-pack</code> from the
        <code>TOOLNAME-wasm</code> crate. <span id="ver"></span>
        <nav class="family">
          A <a href="https://github.com/veripublica">veripublica</a> tool ·
          <!-- TOOL: keep every sibling, and link every one — including this tool.
               These point at GitHub repositories, not at the page you are on, so
               the current tool's link is the one a visitor is most likely to want
               (source, issues, README). Mark it with aria-current="page"; demo.css
               renders it distinctly, by weight, and it stays clickable. (#8)

               THE MEMBERSHIP RULE (#10): this nav lists the tools a reader can
               USE. Not the machinery behind them. epubveri, epubsana, kepubverto,
               epublift are things a visitor might go and run; conventions,
               family-web and styloria are specs, templates and libraries — how
               the tools are built, not something the reader is being offered. They are one hop
               away via the veripublica link above, for the few who want them.
               Do not add a repository here because it is "part of the family."
               Add it because a publisher would click it and be glad.

               THE LIST BELOW IS THE FALLBACK (#2). The current list is
               family-web's nav.json, fetched by the script after this nav; it
               replaces these links when it arrives. Keep them anyway, as they
               were in the template you copied: they are what a reader sees
               offline, on a local server, or if the fetch fails. Your own tool
               is recognised by its aria-current link, so keep that mark. -->
          <span id="family-tools">
            <a href="https://github.com/veripublica/epubveri" aria-current="page">epubveri</a>
            <a href="https://github.com/veripublica/epubsana">epubsana</a>
            <a href="https://github.com/veripublica/kepubverto">kepubverto</a>
            <a href="https://github.com/ePubLift/epublift">epublift</a>
          </span>
        </nav>
        <script>
          // Family nav: the current list, without a release in every tool (#2).
          //
          // What is shared is DATA, not code. nav.json is read as JSON and turned
          // into links with createElement/textContent; nothing from it is ever
          // parsed as HTML or run. A bad entry is skipped, a bad file or a failed
          // fetch leaves the fallback list above exactly as it was.
          //
          // Same host as the live demos (veripublica.github.io), so no third party
          // is involved, and the request carries nothing from the page: not the
          // reader's file, not a result. The no-upload promise above still holds.
          (() => {
            const box = document.getElementById("family-tools");
            const here = box.querySelector('a[aria-current="page"]')?.textContent.trim();
            fetch("https://veripublica.github.io/family-web/nav.json")
              .then((r) => (r.ok ? r.json() : null))
              .then((data) => {
                const tools = (Array.isArray(data?.tools) ? data.tools : []).filter(
                  (t) => typeof t?.name === "string" && /^https:\/\/[^\s]+$/.test(t?.url ?? ""),
                );
                if (!tools.length) return;
                const key = (list) => list.map((t) => t.name + " " + t.url).join("\n");
                const shown = [...box.querySelectorAll("a")].map((a) => ({
                  name: a.textContent.trim(),
                  url: a.getAttribute("href"),
                }));
                if (key(tools) === key(shown)) return; // already current: leave focus alone
                box.replaceChildren(
                  ...tools.flatMap((t) => {
                    const a = document.createElement("a");
                    a.href = t.url;
                    a.textContent = t.name;
                    if (t.name === here) a.setAttribute("aria-current", "page");
                    return [a, " "];
                  }),
                );
              })
              .catch(() => {});
          })();
        </script>
      </footer>
    </main>

    <script type="module">
      // TOOL: import your pkg and wire the drop zone. The drag/drop handlers
      // below are the shared part; run() is yours.
      import init, { version /* , validate | Session … */ } from "../pkg/TOOLNAME.js";

      const statusEl = document.getElementById("status");
      const dropEl = document.getElementById("drop");
      const fileEl = document.getElementById("file");

      let ready = false;
      init()
        .then(() => {
          ready = true;
          statusEl.textContent = "Ready. Drop an .epub.";
          document.getElementById("ver").textContent = "TOOLNAME-wasm v" + version();
        })
        .catch((e) => {
          statusEl.textContent = "Failed to load: " + e;
        });

      async function run(file) {
        if (!ready) return;
        // TOOL: hand the bytes to your wasm API and render into #result.
      }

      fileEl.addEventListener("change", () => {
        if (fileEl.files.length) run(fileEl.files[0]);
      });
      ["dragenter", "dragover"].forEach((ev) =>
        dropEl.addEventListener(ev, (e) => {
          e.preventDefault();
          dropEl.classList.add("over");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        dropEl.addEventListener(ev, (e) => {
          e.preventDefault();
          dropEl.classList.remove("over");
        }),
      );
      dropEl.addEventListener("drop", (e) => {
        const f = e.dataTransfer?.files?.[0];
        if (f) run(f);
      });
    </script>
  </body>
</html>
